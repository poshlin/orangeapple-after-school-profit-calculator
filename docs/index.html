<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>橘子蘋果｜安親班合作收益試算器</title>
  <meta name="description" content="現場輸入生源、課程與設備條件，立即估算季收益、年度收益與回本時間。" />
  <style>
    :root{--paper:#f6f2ea;--ink:#171717;--muted:#716c64;--orange:#f4a000;--coral:#f15b5d;--teal:#00afa3;--line:#ded8ce}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,input,select{font:inherit}main{max-width:1440px;margin:auto;padding:34px 54px 30px}.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:34px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center}.brand img{display:block;width:244px;height:auto}.version{font-size:13px;color:var(--muted);font-weight:700}.intro{padding:48px 0 34px}.eyebrow{margin:0 0 14px;color:var(--orange);font-weight:800;font-size:14px;letter-spacing:.12em}.intro h1{font-size:48px;line-height:1.14;letter-spacing:-.035em;margin:0;max-width:820px}.intro>p:last-child{font-size:18px;color:var(--muted);margin:20px 0 0}.calculator{display:grid;grid-template-columns:minmax(360px,.82fr) minmax(520px,1.18fr);border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 24px 70px rgba(50,40,20,.08)}.inputs,.results{padding:38px 42px}.results{background:#1c1d1c;color:#fff}.section-title{display:flex;gap:14px;align-items:center;margin-bottom:30px}.section-title span{font-size:14px;font-weight:900;color:var(--orange)}.section-title h2{font-size:24px;margin:0}.light h2{color:#fff}.light span{color:#5fd4ca}.field{display:block;margin-bottom:20px}.field>span{display:block;font-size:14px;font-weight:800;margin-bottom:8px}.field small{display:block;color:#969087;font-size:12px;margin-top:6px}input,select{width:100%;border:1px solid var(--line);background:#faf8f4;border-radius:12px;padding:13px 14px;outline:none;color:var(--ink)}input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(244,160,0,.13)}input:disabled{color:#777;background:#eee}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.subhead{border-top:1px solid var(--line);padding-top:24px;margin:8px 0 18px;font-weight:900}.money-input{position:relative}.money-input span{position:absolute;left:13px;top:14px;color:#8d877e;font-size:13px;font-weight:800}.money-input input{padding-left:48px}.notice{background:#fff1d5;border-radius:14px;padding:18px;line-height:1.5;color:#6d5430;font-weight:700}.headline-result{padding:12px 0 30px;border-bottom:1px solid #3d3f3e}.headline-result p{margin:0 0 8px;color:#b9bbb9;font-weight:700}.headline-result strong{display:block;font-size:50px;color:#ffb21e;letter-spacing:-.035em}.headline-result span{display:block;margin-top:12px;color:#b9bbb9;font-size:14px}.periods{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#3d3f3e;margin:0 -42px}.periods div{background:#242625;padding:24px 42px}.periods span,.equipment-grid span{display:block;color:#aeb1ae;font-size:13px;margin-bottom:8px}.periods b{font-size:25px}.equipment-summary{padding-top:28px}.summary-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.summary-top h3{margin:0;font-size:20px}.summary-top span{color:#5fd4ca;font-size:13px;font-weight:800;text-align:right}.equipment-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;margin-top:22px}.equipment-grid b{font-size:20px}.zero{background:#2b2d2c;padding:20px;border-radius:14px;color:#d8dad8}.statement{margin-top:28px;background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 24px}.statement>span{font-size:12px;color:var(--orange);font-weight:900;letter-spacing:.1em}.statement p{margin:10px 0 0;line-height:1.65}.statement b{color:#008f85}footer{display:flex;justify-content:space-between;gap:30px;color:var(--muted);font-size:12px;padding-top:22px}footer p{margin:0}.hidden{display:none!important}
    @media(max-width:900px){main{padding:22px}.intro{padding:36px 0 26px}.intro h1{font-size:38px}.calculator{grid-template-columns:1fr}.results,.inputs{padding:34px 28px}.periods{margin:0 -28px}.periods div{padding:22px 28px}.headline-result strong{font-size:42px}footer{flex-direction:column;gap:6px}}
    @media(max-width:560px){main{padding:14px}.brand img{width:190px}.version{display:none}.intro h1{font-size:32px}.intro>p:last-child{font-size:16px}.two-col,.equipment-grid{grid-template-columns:1fr}.periods b{font-size:20px}.headline-result strong{font-size:36px}}
  </style>
</head>
<body><main>
  <header class="topbar"><div class="brand"><img src="logo-full.png" alt="橘子蘋果程式學苑"></div><div class="version">安親班合作收益試算器 · 2026</div></header>
  <section class="intro"><p class="eyebrow">合作評估工具</p><h1>把主任提出的條件，<br>立即換成看得懂的收益。</h1><p>價格、堂數與30%分潤由系統自動帶入；業務只需輸入合作條件。</p></section>
  <section class="calculator">
    <aside class="inputs"><div class="section-title"><span>01</span><h2>輸入合作條件</h2></div>
      <label class="field"><span>第一門課程</span><select id="course1"></select></label>
      <div class="two-col"><label class="field"><span>每班學生數</span><input id="students1" type="number" min="1" max="40" value="6"><small>新時段4人可啟動</small></label><label class="field"><span>每週上課頻率</span><input value="每週 1 堂" disabled><small>合作班固定每週一堂</small></label></div>
      <div class="subhead">第二門課程（選填）</div>
      <label class="field"><span>是否加入第二門課</span><select id="course2"></select></label>
      <label class="field hidden" id="students2Wrap"><span>第二門課學生數</span><input id="students2" type="number" min="1" max="40" value="4"><small>與第一門課安排不同時段，共用同一批設備</small></label>
      <div class="subhead">設備條件</div>
      <div id="tabletNotice" class="notice hidden">目前選擇的課程使用平板；本版不計入筆電採購與分期。</div>
      <div id="laptopFields"><label class="field"><span>中心既有合格筆電</span><input id="owned" type="number" min="0" max="100" value="0"></label><label class="field"><span>每台完整交付價</span><div class="money-input"><span>NT$</span><input id="devicePrice" type="number" min="0" step="500" value="13000"></div><small>依當日有效報價，須包含檢測、設定與兩年維護</small></label></div>
    </aside>
    <section class="results"><div class="section-title light"><span>02</span><h2>主任專屬收益預估</h2></div>
      <div class="headline-result"><p>一年預估增加</p><strong id="annual"></strong><span id="headlineMeta"></span></div>
      <div class="periods"><div><span>每月預估</span><b id="monthly"></b></div><div><span>一季預估</span><b id="quarterly"></b></div></div>
      <div class="equipment-summary"><div class="summary-top"><h3>設備與回本</h3><span id="deviceMeta"></span></div><p class="zero hidden" id="zero">無新增筆電投入，中心可直接取得每月分潤。</p><div class="equipment-grid" id="equipmentGrid"><div><span>設備完整投入</span><b id="equipmentTotal"></b></div><div><span>30% 頭期</span><b id="downPayment"></b></div><div><span>設備預估清償</span><b id="payoff"></b></div><div><span>累積現金回本</span><b id="breakEven"></b></div></div></div>
      <div class="statement"><span>試算摘要</span><p id="summary"></p></div>
    </section>
  </section>
  <footer><p>本工具為合作評估情境，實際金額依學生當月消化堂數、有效設備報價與正式合約為準。</p><p>課程實收包含學費與教材，中心分潤按家長實收30%計算。</p></footer>
</main>
<script>
const courses={minecraft:{name:"Minecraft 麥塊程式班教育版",tuition:17800,lessons:15,device:"筆電"},roblox:{name:"Roblox AI 遊戲設計班",tuition:17800,lessons:15,device:"筆電"},scratch:{name:"Scratch 實戰班（SB）",tuition:17800,lessons:15,device:"筆電"},python:{name:"Python 程式開發班（PYB）",tuition:19400,lessons:15,device:"筆電"},albert:{name:"頑皮艾伯特不在家",tuition:18300,lessons:35,device:"平板"}};
const $=id=>document.getElementById(id),fmt=n=>"NT$ "+Math.round(n).toLocaleString("zh-TW"),num=(id,min=0)=>Math.max(min,Number($(id).value)||0);
function fillCourses(){Object.entries(courses).forEach(([key,c])=>$("course1").add(new Option(c.name,key)));$("course2").add(new Option("不加入第二門課","none"));Object.entries(courses).forEach(([key,c])=>$("course2").add(new Option(c.name,key)));}
function calculate(){const k1=$("course1").value,k2=$("course2").value,c1=courses[k1],c2=k2==="none"?null:courses[k2];if(k2===k1){$("course2").value="none";return calculate()}const n1=num("students1",1),n2=c2?num("students2",1):0;$("students2Wrap").classList.toggle("hidden",!c2);[...$("course2").options].forEach(o=>o.disabled=o.value===k1);const monthly=n1*(c1.tuition/c1.lessons)*.3*4+(c2?n2*(c2.tuition/c2.lessons)*.3*4:0),quarterly=monthly*3,annual=monthly*12;const laptopSize=Math.max(c1.device==="筆電"?n1:0,c2&&c2.device==="筆電"?n2:0),needed=laptopSize?Math.max(0,laptopSize+1-num("owned")):0,equipment=needed*num("devicePrice"),down=equipment*.3,balance=equipment-down,payoff=equipment&&monthly?Math.ceil(balance/monthly):0,breakEven=equipment&&monthly?Math.ceil(equipment/monthly):0;const noLaptop=laptopSize===0;$("tabletNotice").classList.toggle("hidden",!noLaptop);$("laptopFields").classList.toggle("hidden",noLaptop);$("annual").textContent=fmt(annual);$("monthly").textContent=fmt(monthly);$("quarterly").textContent=fmt(quarterly);$("headlineMeta").textContent=(c2?`兩門課共 ${n1+n2} 位學生`:`${n1} 位學生`)+" · 固定每週一堂";$("deviceMeta").textContent=noLaptop?"平板課程":`需新增 ${needed} 台（含1台備機）`;const zero=equipment===0;$("zero").classList.toggle("hidden",!zero);$("equipmentGrid").classList.toggle("hidden",zero);$("equipmentTotal").textContent=fmt(equipment);$("downPayment").textContent=fmt(down);$("payoff").textContent=`第 ${payoff} 個月`;$("breakEven").textContent=`第 ${breakEven} 個月`;$("summary").innerHTML=`以目前條件，${c2?`${c1.name}與${c2.name}安排不同時段，`:""}中心一季預估取得 <b>${fmt(quarterly)}</b>、一年約 <b>${fmt(annual)}</b> 分潤。${equipment?`筆電依較大班級共用，設備預估於第 ${payoff} 個月清償，第 ${breakEven} 個月達成累積現金回本。`:"目前不需新增筆電投入。"}`;}
fillCourses();["course1","course2","students1","students2","owned","devicePrice"].forEach(id=>$(id).addEventListener("input",calculate));calculate();
</script></body></html>
